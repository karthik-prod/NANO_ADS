::-webkit-scrollbar {width: 0;display: none;background: transparent;}
*{box-sizing: border-box; margin:0;padding:0; -webkit-tap-highlight-color: transparent;}
html, body {-webkit-overflow-scrolling: auto;}
a, img{outline:0} ul{list-style:none} img{border:none} a{text-decoration:none;cursor:pointer;}
body{font-family: 'montserrat_regular', system-ui, sans-serif, 'Segoe UI', 'Open Sans', 'Helvetica Neue'; background: #fff;}
.ed-slot-wrapper{position: relative; margin: 0 auto; max-width: 300px; height: 50px; background: url('https://reperformmedia-a.akamaihd.net/__media__/pics/9000/10/314/ed-bg-728-90.jpg') left top no-repeat; background-size: cover; overflow: hidden;}

.header-wrap{position: absolute; top:7px; left:8px; padding-left: 18px; height: 16px; overflow: hidden;}
.header-wrap .header-title {font-size: 11px; line-height: 16px; color: #2C2C2C;}
.header-wrap .icon {position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; overflow: hidden;}

.ed-slot-container{display: flex; justify-content: center; align-items: center; position: relative; height: 100%;}
.ed-slot-content{position: relative; min-width: 320px; min-height: 50px;}
.ed-slot-content-inner{position: relative; z-index: 999;}

.footer-wrap{position: absolute; bottom: 7px; right: 8px; max-width: calc(100% - 16px); padding-left: 18px; height: 18px; overflow: hidden;}
.footer-wrap .brand_txt {font-size: 13px; line-height: 18px; color: #2C2C2C; overflow: hidden; word-wrap: break-word; white-space: nowrap; text-overflow: ellipsis;}
.footer-wrap .icon {position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; overflow: hidden;}

    </style>
</stl_head>
