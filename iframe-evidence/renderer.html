<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nano renderer</title>
</head>
<body style="margin:0">
<script>
window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'nano-adcode') return;
  document.open();
  document.write('<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0">' + e.data.html + '</body></html>');
  document.close();
});
</script>
</body>
</html>
